<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stat Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-red-700 text-white min-h-screen flex flex-col items-center justify-center font-sans"
  >
    <h1 class="text-3xl font-bold mt-6 mb-2">Prediction Result</h1>
    {% if selected_player %}
    <p class="text-yellow-200 mb-4">
      Showing prediction for <strong>{{ selected_player }}</strong>
    </p>
    {% endif %}

    <div class="bg-white rounded-xl shadow-lg p-6 max-w-3xl w-full">
      <img
        src="data:image/png;base64,{{ fig }}"
        alt="Stat Prediction"
        class="rounded-xl border border-gray-200 shadow"
      />
    </div>

    <a href="/" class="mt-6 text-yellow-300 hover:underline text-sm"
      >← Back to Home</a
    >
  </body>
</html>
