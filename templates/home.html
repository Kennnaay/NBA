<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PPG / Stat Predictor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-red-700 text-white min-h-screen flex flex-col items-center justify-center font-sans">

  <h1 class="text-3xl font-bold mb-2">Stat Predictor</h1>
  <p class="mb-6 text-sm text-yellow-200">Select a player and a stat type to analyze</p>

  <form action="/analyze_player" method="POST" class="bg-red-600 p-6 rounded-xl shadow-lg w-full max-w-sm space-y-4">
    <div>
      <label class="block text-sm font-semibold mb-1">Player</label>
      <select name="player" class="w-full p-2 rounded-md text-black">
        {% for p in players %}
          <option value="{{p}}" {% if p == selected_player %}selected{% endif %}>{{p}}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">What to display</label>
      <select name="graph" class="w-full p-2 rounded-md text-black">
        {% for p in graph %}
          <option value="{{p}}" {% if p == selected_graph %}selected{% endif %}>{{p}}</option>
        {% endfor %}
      </select>
      <label class="flex items-center space-x-2 text-sm mt-2">
        <input type="checkbox" name="predict" value="true" class="accent-yellow-400">
        <span>Include future prediction</span>
      </label>
    </div>

    <div class="mt-4">
        <label class="block text-sm font-semibold mb-1">Prediction Type</label>
        <select name="mode" class="w-full p-2 rounded-md text-black">
          <option value="season">Season</option>
          <option value="game">Next Game</option>
        </select>
    </div>

    <div>
      <input type="submit" value="Check Info" class="bg-yellow-400 text-red-900 font-bold py-2 px-4 rounded hover:bg-yellow-300 cursor-pointer w-full">
    </div>

    
  </form>

</body>
</html>
